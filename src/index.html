<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>분당구 학원 찾기 도우미</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #5d6675; --line: #dde1e7;
    --accent: #2457c5; --accent-soft: #eef2fb;
    --virtual: #6b35b8; --virtual-bg: #f6f0fd; --virtual-line: #d9c6f3;
    --public: #0f7a4a; --public-bg: #ebf7f0; --public-line: #bfe3cf;
    --error: #b42318; --error-bg: #fdecea;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 19px/1.7 "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
         word-break: keep-all; overflow-wrap: anywhere; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 40px; }
  header { text-align: center; margin-bottom: 24px; }
  h1 { font-size: 30px; margin: 0 0 6px; line-height: 1.3; }
  .sub { color: var(--muted); margin: 0; font-size: 17px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 22px; margin-bottom: 20px; }

  /* 질문 입력 */
  textarea { width: 100%; font: inherit; font-size: 21px; padding: 16px 18px; min-height: 120px; resize: vertical;
             border: 2px solid var(--line); border-radius: 12px; }
  textarea:focus { outline: none; border-color: var(--accent); }
  .ask-btn { width: 100%; margin-top: 12px; font: inherit; font-size: 21px; font-weight: 700; cursor: pointer;
             background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 14px; }
  .ask-btn:disabled { opacity: .55; cursor: wait; }
  .hint { margin-top: 18px; }
  .hint-title { font-size: 15px; color: var(--muted); margin-bottom: 8px; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; }
  .examples button { font: inherit; font-size: 15px; cursor: pointer; text-align: left; line-height: 1.4;
                     background: var(--accent-soft); color: var(--accent); border: 1px solid #cfdaf3;
                     border-radius: 999px; padding: 6px 14px; }

  /* 기다리는 동안 */
  .loading { text-align: center; padding: 28px 16px; }
  .loading p { margin: 0 0 14px; font-size: 20px; font-weight: 700; }
  .loading small { display: block; color: var(--muted); font-size: 15px; margin-top: 10px; }
  .bar { height: 8px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 35%; background: var(--accent); border-radius: 999px;
              animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(290%); } }

  .error { background: var(--error-bg); color: var(--error); border-color: #f5c2bd; text-align: center; font-weight: 700; }

  /* 답변 */
  .answer h1, .answer h2, .answer h3, .answer h4 { line-height: 1.4; margin: 20px 0 10px; }
  .answer h1 { font-size: 25px; } .answer h2 { font-size: 23px; } .answer h3 { font-size: 21px; } .answer h4 { font-size: 19px; }
  .answer > :first-child, .group > :nth-child(2) { margin-top: 0; }
  .answer p { margin: 10px 0; }
  .answer ul, .answer ol { margin: 8px 0; padding-left: 24px; }
  .answer li { margin: 4px 0; }
  .answer hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
  .answer blockquote { margin: 12px 0; padding: 10px 14px; background: #fff8e6; border-left: 5px solid #e3a008; border-radius: 8px; }
  .table-wrap { overflow-x: auto; margin: 12px 0; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-size: 17px; background: #fff; }
  th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; min-width: 80px; }
  th { background: #f0f3f8; }

  /* 가상 / 실제 묶음 */
  .group { border-radius: 14px; padding: 16px 16px 8px; margin: 18px 0; border: 2px solid; }
  .group.virtual { background: var(--virtual-bg); border-color: var(--virtual-line); }
  .group.public  { background: var(--public-bg);  border-color: var(--public-line); }
  .badge { display: inline-block; font-size: 14px; font-weight: 700; line-height: 1.5; border-radius: 999px;
           padding: 2px 10px; white-space: nowrap; vertical-align: middle; }
  .badge.virtual { background: var(--virtual); color: #fff; }
  .badge.public  { background: var(--public);  color: #fff; }
  .badge.small { font-size: 12px; padding: 0 7px; }
  .group-badge { margin-bottom: 6px; }

  /* 근거 자료 */
  details.sources > summary { cursor: pointer; font-size: 19px; font-weight: 700; color: var(--accent); }
  .src { border: 1px solid var(--line); border-radius: 10px; margin: 10px 0; overflow: hidden; }
  .src.virtual { border-left: 6px solid var(--virtual); }
  .src.public  { border-left: 6px solid var(--public); }
  .src-head { padding: 8px 12px; font-size: 15px; color: var(--muted); background: #fafbfc; }
  .src pre { margin: 0; padding: 10px 12px; white-space: pre-wrap; font: inherit; font-size: 15px; line-height: 1.55; }

  footer { text-align: center; color: var(--muted); font-size: 15px; padding: 8px 8px 0; }
  .hidden { display: none; }

  @media (max-width: 600px) {
    body { font-size: 18px; }
    main { padding-top: 20px; }
    h1 { font-size: 25px; }
    .card { padding: 18px 16px; }
    textarea { font-size: 19px; min-height: 110px; }
    .group { padding: 14px 12px 6px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>분당구 학원 찾기 도우미</h1>
    <p class="sub">중학생 수학·영어 학원을 조건으로 찾아 드려요</p>
  </header>

  <section class="card">
    <form id="form">
      <textarea id="q" placeholder="동네, 학년, 과목, 원하는 반을 적어 주세요.&#10;예) 정자동에 중2 수학 내신대비반 있는 학원 알려줘"></textarea>
      <button class="ask-btn" id="btn" type="submit">학원 찾기</button>
    </form>
    <div class="hint">
      <div class="hint-title">이렇게 물어보세요</div>
      <div class="examples" id="examples"></div>
    </div>
  </section>

  <section class="card loading hidden" id="loading">
    <p>학원 정보를 찾고 있어요</p>
    <div class="bar"><span></span></div>
    <small id="elapsed">보통 20~60초 걸려요</small>
  </section>

  <section class="card error hidden" id="error">잠시 후 다시 시도해 주세요.</section>

  <section class="card hidden" id="result">
    <div class="answer" id="answer"></div>
  </section>

  <section class="card hidden" id="sourcesCard">
    <details class="sources">
      <summary id="sourcesTitle">근거 자료 보기</summary>
      <div id="sources"></div>
    </details>
  </section>

  <footer>가상 학원은 시연용 예시 데이터입니다. 실제 등록 전 학원에 직접 확인하세요.</footer>
</main>

<script>
const EXAMPLES = [
  "정자동에 중2 수학 내신대비반 있는 학원 알려줘",
  "중1 영어 기초부터 잡아주는 학원 있어?",
  "수내동 수학 학원들 교습비 비교해줘",
  "판교 쪽 중학생 수학 학원 있어?",
];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

EXAMPLES.forEach((text) => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = text;
  b.onclick = () => { $("q").value = text; $("q").focus(); };
  $("examples").appendChild(b);
});

// ── 마크다운 → HTML (제목·굵게·표·목록·인용·구분선) ──
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "$1")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>")
    .replace(/\(가상\)/g, '<span class="badge virtual small">가상</span>')
    .replace(/\(실제\)/g, '<span class="badge public small">실제</span>');
}
function cells(line) {
  return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
}
// 제목으로 묶음 종류 판단: 가상 / 실제 / 일반
function groupKind(title) {
  if (/가상/.test(title)) return "virtual";
  if (/공공데이터|실제/.test(title)) return "public";
  return null;
}
const GROUP_BADGE = {
  virtual: '<div class="group-badge"><span class="badge virtual">학원 소개 자료 · 가상</span></div>',
  public: '<div class="group-badge"><span class="badge public">공공데이터 · 실제</span></div>',
};

function renderMarkdown(md) {
  const lines = String(md || "").replace(/\r/g, "").split("\n");
  let html = "", i = 0, para = [], group = null;   // group = {level}
  const flush = () => { if (para.length) { html += "<p>" + para.map(inline).join("<br>") + "</p>"; para = []; } };
  const closeGroup = () => { if (group) { flush(); html += "</div>"; group = null; } };
  while (i < lines.length) {
    const line = lines[i].trim();
    if (!line) { flush(); i++; continue; }
    if (line.startsWith("|") && i + 1 < lines.length && /^\|?\s*:?-{2,}/.test(lines[i + 1].trim())) {
      flush();
      const head = cells(line); i += 2;
      let body = "";
      while (i < lines.length && lines[i].trim().startsWith("|")) {
        body += "<tr>" + cells(lines[i]).map((c) => "<td>" + inline(c) + "</td>").join("") + "</tr>"; i++;
      }
      html += '<div class="table-wrap"><table><thead><tr>' + head.map((c) => "<th>" + inline(c) + "</th>").join("") +
              "</tr></thead><tbody>" + body + "</tbody></table></div>";
      continue;
    }
    let m;
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) {
      flush();
      const level = m[1].length, kind = groupKind(m[2]);
      if (group && level <= group.level) closeGroup();
      if (kind && level <= 3) { closeGroup(); html += `<div class="group ${kind}">` + GROUP_BADGE[kind]; group = { level }; }
      html += `<h${level}>${inline(m[2])}</h${level}>`; i++; continue;
    }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(line)) { flush(); html += "<hr>"; i++; continue; }
    if (line.startsWith(">")) {
      flush(); const q = [];
      while (i < lines.length && lines[i].trim().startsWith(">")) { q.push(lines[i].trim().replace(/^>\s?/, "")); i++; }
      html += "<blockquote>" + q.map(inline).join("<br>") + "</blockquote>"; continue;
    }
    if (/^([-*]|\d+\.)\s+/.test(line)) {
      flush(); const ordered = /^\d+\./.test(line); const items = [];
      while (i < lines.length && /^([-*]|\d+\.)\s+/.test(lines[i].trim())) {
        items.push(lines[i].trim().replace(/^([-*]|\d+\.)\s+/, "")); i++;
      }
      const tag = ordered ? "ol" : "ul";
      html += `<${tag}>` + items.map((t) => "<li>" + inline(t) + "</li>").join("") + `</${tag}>`; continue;
    }
    para.push(line); i++;
  }
  closeGroup(); flush();
  return html;
}

// ── 결과 그리기 (trace는 고객 화면에 보여주지 않음) ──
function show(data) {
  $("answer").innerHTML = renderMarkdown(data.answer);
  const ctx = data.contexts || [];
  $("sources").innerHTML = ctx.map((c) => {
    const kind = String(c.doc_id).startsWith("public:") ? "public" : "virtual";
    const label = kind === "public" ? "공공데이터 · 실제" : "학원 소개 자료 · 가상";
    return `<div class="src ${kind}"><div class="src-head"><span class="badge ${kind}">${label}</span></div><pre>${esc(c.text)}</pre></div>`;
  }).join("");
  $("sourcesTitle").textContent = `근거 자료 보기 (${ctx.length}개)`;
  $("result").classList.remove("hidden");
  $("sourcesCard").classList.toggle("hidden", ctx.length === 0);
}

// 엔터 = 검색, Shift+엔터 = 줄바꿈. 한글 조합 중에 누른 엔터는 무시 (두 번 전송·마지막 글자 잘림 방지)
$("q").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || e.shiftKey) return;
  if (e.isComposing || e.keyCode === 229) return;
  e.preventDefault();
  $("form").requestSubmit();
});

let busy = false;
$("form").onsubmit = async (e) => {
  e.preventDefault();
  const question = $("q").value.trim();
  if (!question || busy) return;
  busy = true; $("btn").disabled = true; $("btn").textContent = "찾는 중…";
  ["error", "result", "sourcesCard"].forEach((id) => $(id).classList.add("hidden"));
  $("loading").classList.remove("hidden");
  const t0 = Date.now();
  const timer = setInterval(() => {
    $("elapsed").textContent = `보통 20~60초 걸려요 · ${Math.floor((Date.now() - t0) / 1000)}초`;
  }, 1000);
  try {
    const res = await fetch("/query", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    show(await res.json());
  } catch (err) {
    console.error(err);   // 기술적인 내용은 콘솔에만 남기고 화면엔 안내 문구만
    $("error").classList.remove("hidden");
  } finally {
    clearInterval(timer);
    $("loading").classList.add("hidden");
    $("elapsed").textContent = "보통 20~60초 걸려요";
    busy = false; $("btn").disabled = false; $("btn").textContent = "학원 찾기";
  }
};
</script>
</body>
</html>
